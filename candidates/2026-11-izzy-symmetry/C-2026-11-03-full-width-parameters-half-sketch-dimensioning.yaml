id: C-2026-11-03
title: Full-Width Parameters & Half-Sketch Dimensioning
category: Symmetry & Mirror
priority: Must
status: Candidate
rule: >-
  Full-Width Source of Truth: Define overall widths and spans as full-dimension snake_case User Parameters
  (e.g., base_width), never as pre-halved parameters. Sketching Half-Profiles: Either use a Centerline
  construction line to dimension full width directly in the sketch, or set the half-span dimension to
  <param_name> / 2 (e.g., base_width / 2). Origin Lock: Constrain the symmetry boundary line or key datum
  point directly to the model origin or a native origin plane/axis so parameter changes never drift off-center.
why: >-
  Storing half-widths as raw numbers or separate parameters obscures true part dimensions during reviews
  and CSV exports, while unanchored symmetry lines can shift off-origin when dimensions flex.
good: >-
  base_width in the parameter table; the half sketch dimensioned across a Centerline (keeps R08 intact)
avoid: half_width = 20 mm as the only width parameter
works:
  aa: 2
  gpt: 2
  claude: 2
  gem: 2
scope:
- part
- assembly
conflicts_with:
