id: R07
title: Comment every parameter
category: Parameters
priority: Must
status: Proven
rule: >-
  Give every user parameter a comment that says what it controls, written in the same session that creates
  it.
why: >-
  The AI that made the parameter knows why it exists, and comments survive the parameter export.
good: 'handle_length: overall handle length from the guard face to the far end'
avoid: 29 parameters with empty comment fields
