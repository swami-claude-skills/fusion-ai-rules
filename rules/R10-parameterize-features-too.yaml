id: R10
title: Parameterize features too
category: Parameters
priority: Must
status: Proven
rule: >-
  Parameterize extrude distances, fillet radii and other feature values, not only sketch dimensions. Reuse
  one parameter when two values must always match.
why: >-
  A first cleanup that covers only sketches still leaves hard-coded values in the features.
good: Fillet radius = edge_fillet_r
avoid: Fillet radius typed as 0.25 mm
