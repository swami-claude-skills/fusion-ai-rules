id: R26
title: Hold until confirmed
category: Working with the AI
priority: Must
status: Proven
rule: >-
  Don't take any action until I confirm. Analyse first, then show the full plan or list and wait.
why: >-
  Without this, the AI often starts changing the model before you have seen the plan.
good: Plan shown, three questions asked, then one approved pass
avoid: Changes made while still answering a question
