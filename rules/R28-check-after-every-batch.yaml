id: R28
title: Check after every batch
category: Working with the AI
priority: Must
status: Proven
rule: >-
  After every batch, check an invariant such as volume or mass, plus errors, warnings and timeline health.
  Don't save until told.
why: A hard number proves the change did not move geometry.
good: '"Handle volume still 5.654 cm3; no errors or warnings"'
avoid: Saving straight after a batch without a check
