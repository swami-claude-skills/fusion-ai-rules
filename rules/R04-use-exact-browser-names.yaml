id: R04
title: Use exact browser names
category: Naming
priority: Should
status: Proven
rule: >-
  When you report or ask about an item, use its exact name from the browser or parameter table.
why: Exact names remove guessing about which component, sketch or parameter is meant.
good: '"PocketElevation sketch, dimension d447"'
avoid: '"the second sketch on the handle"'
