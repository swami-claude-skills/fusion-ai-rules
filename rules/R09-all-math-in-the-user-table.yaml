id: R09
title: All math in the user table
category: Parameters
priority: Must
status: Proven
rule: >-
  Keep all arithmetic in the user parameter table. A derived value stays a formula there, built from other
  named parameters.
why: There is one place to find and change every calculation.
good: handle_neck_width = guard_width - 2 * neck_inset
avoid: A formula typed into a sketch dimension
