id: R17
title: Model symmetric parts as halves
category: Features
priority: Should
status: Deprecated
rule: >-
  Model a symmetric part as a half (or a quarter where that works) and mirror the feature or body in the
  timeline, not inside the sketch.
why: >-
  Half the dimensions and half the fillets, and the mirror is visible in the timeline. Replaced in 2.0.0
  by R36, which says how: a half or quarter on the origin planes, then one Body Mirror (Join).
good: Half the key, then Mirror_Body
avoid: The whole part drawn out with midpoints and no mirror
