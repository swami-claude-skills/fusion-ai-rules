id: R18
title: Intersect to keep a shape
category: Features
priority: Nice to have
status: Untested
rule: >-
  When the intent is "keep this shape", prefer one intersect over several cuts. On a symmetric part, do
  it on the half body before the mirror (R36), never on the full part.
why: One intersect shows the intent; several cuts hide it.
good: Intersect with the outline body
avoid: Two cuts that remove the outer pieces
