id: R29
title: Ask about scope
category: Working with the AI
priority: Should
status: Proven
rule: >-
  Before a cleanup, ask about scope: sketches and features, whether to ignore driven dimensions, whether
  to reuse parameters, and whether derived values stay formulas.
why: A clear scope avoids a sketch-only pass that misses the features.
good: Three questions answered before the one pass
avoid: A cleanup that silently skipped every feature
