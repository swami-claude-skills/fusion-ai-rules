id: R08
title: One user parameter per dimension
category: Parameters
priority: Must
status: Proven
rule: >-
  Every sketch dimension and feature distance references exactly one user parameter. Never put math or
  literal numbers in a model (d###) parameter expression.
why: >-
  Only user parameters export, and math hidden in d-parameters is hard to find and change.
good: d361 = stem_cutout_offset
avoid: d361 = (stem_width - 6 mm) / 2
