id: R38
title: Full-Width Parameters & Half-Sketch Dimensioning
category: Symmetry & Mirror
priority: Must
status: Untested
rule: >-
  Full-Width Source of Truth: Define overall widths and spans as full-dimension snake_case User Parameters
  (e.g., base_width), never as pre-halved parameters. Sketching Half-Profiles: Use a Centerline construction
  line to dimension the full width directly in the sketch. If a half value is truly needed, add it to
  the user parameter table as a formula of the full width (e.g., base_half_width = base_width / 2) and
  reference that parameter; never type / 2 into a sketch dimension. Origin Lock: Constrain the symmetry
  boundary line or key datum point directly to the model origin or a native origin plane/axis so parameter
  changes never drift off-center.
why: >-
  Storing half-widths as raw numbers or separate parameters obscures true part dimensions during reviews
  and CSV exports, while unanchored symmetry lines can shift off-origin when dimensions flex.
good: >-
  base_width in the parameter table; the half sketch dimensioned across a Centerline
avoid: >-
  half_width = 20 mm as the only width parameter, or a sketch dimension typed as base_width / 2
works:
  aa: 2
  gpt: 2
  claude: 2
  gem: 2
scope:
- part
- assembly
conflicts_with: []
related:
