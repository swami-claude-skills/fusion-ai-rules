id: R11
title: Break up long formulas
category: Parameters
priority: Should
status: Untested
rule: >-
  Split a long formula into named intermediate parameters, so each term says what it does.
why: A reader can check each step instead of decoding one long expression.
good: pocket_rise, then pocket_floor_end = pocket_floor_start + pocket_rise
avoid: One parameter holding a five-term slope formula
works:
  aa: 2
  gpt: 2
  claude: 2
  gem: 2
