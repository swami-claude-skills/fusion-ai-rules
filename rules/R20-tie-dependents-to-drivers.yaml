id: R20
title: Tie dependents to drivers
category: Robustness
priority: Must
status: Failed once
rule: >-
  Make dependent features, such as a pocket or a lanyard hole, follow the parameters that drive the part,
  such as the handle length.
why: >-
  Changing one key value should move everything that depends on it, with no hidden collisions.
good: Pocket and hole positions measured from the handle end
avoid: Pocket stays put when handle_length changes and cuts into the hole
works:
  aa: 2
  gpt: 2
  claude: 2
  gem: 2
scope:
- any
