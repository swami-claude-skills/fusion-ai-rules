id: R12
title: Link by meaning, not by value
category: Parameters
priority: Must
status: Failed once
rule: >-
  Before linking a dimension to a parameter, check what the dimension actually measures in the sketch.
  Equal numbers are not the same dimension.
why: >-
  A link made because values match breaks the model silently when the parameter changes.
good: 24 mm pocket end gets its own pocket_in_end parameter
avoid: 24 mm pocket end linked to handle_length because both were 24
works:
  aa: 2
  gpt: 2
  claude: 2
  gem: 2
