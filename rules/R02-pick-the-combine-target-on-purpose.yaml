id: R02
title: Pick the combine target on purpose
category: Naming
priority: Should
status: Untested
rule: >-
  When you combine bodies, choose the target body deliberately: the first body picked keeps its name.
why: The final body ends up with a sensible name instead of a tool body's name.
good: Target = the body already named for the finished part
avoid: The finished part named after a leftover cutting body
