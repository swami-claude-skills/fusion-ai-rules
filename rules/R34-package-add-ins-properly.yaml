id: R34
title: Package add-ins properly
category: Files & Setup
priority: Should
status: Untested
rule: >-
  Package a Fusion add-in as one folder with its manifest, and keep it in a GitHub repository.
why: It is installable, and every change is tracked.
good: MyAddIn/ with MyAddIn.manifest and MyAddIn.py, in a repo
avoid: Loose script files copied between folders
