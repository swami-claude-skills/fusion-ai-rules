name: A rule failed in an AI
description: Report an AI that had the rules loaded but did not follow one.
title: "Rule failed: "
labels: [test-result]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: R13
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI
      options: [Autodesk Assistant, Claude, ChatGPT, Gemini, Other]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model or version (if shown), and how the rules were loaded
      placeholder: Claude Desktop with the skill; Fusion MCP connected
  - type: input
    id: ruleset
    attributes:
      label: Rule-set version from the top of the export
      placeholder: 1.0.0
  - type: textarea
    id: what
    attributes:
      label: What you asked, and what the AI did instead
    validations:
      required: true
